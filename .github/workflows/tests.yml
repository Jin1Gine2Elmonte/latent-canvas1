name: Latent Canvas CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Cairo & Pango Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check latent_canvas/ tests/

      - name: Type Checking (Mypy)
        run: |
          mypy latent_canvas/

      - name: Run Test Suite & Measure Coverage
        env:
          GEMINI_API_KEY: "mock_ci_token"
        run: |
          pytest tests/ -v --cov=latent_canvas --cov-report=term-missing

      - name: Test CLI Entry Point
        run: |
          latent-canvas version
          latent-canvas inspect-prompt
          latent-canvas benchmark
