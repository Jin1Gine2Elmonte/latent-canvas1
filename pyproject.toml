[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-canvas"
version = "0.1.0"
description = "Visual Chain-of-Thought (Visual-CoT) developer framework and multimodal verification harness using topological graph synthesis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Latent Canvas Research Group", email = "research@latent-canvas.org" },
]
keywords = [
    "visual-cot",
    "chain-of-thought",
    "multimodal",
    "topological-reasoning",
    "gemini",
    "google-genai",
    "causal-inference",
    "neurosymbolic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "cairosvg>=2.7.0",
    "pillow>=10.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
latent-canvas = "latent_canvas.cli:main"

[project.urls]
Homepage = "https://github.com/latent-canvas/latent-canvas"
Documentation = "https://latent-canvas.readthedocs.io"
Repository = "https://github.com/latent-canvas/latent-canvas.git"
Issues = "https://github.com/latent-canvas/latent-canvas/issues"

[tool.hatch.build.targets.wheel]
packages = ["latent_canvas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
