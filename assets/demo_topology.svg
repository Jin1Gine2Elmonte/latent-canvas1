<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-conflict" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <!-- Header Badge -->
  <rect x="30" y="25" width="360" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="45" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">LATENT CANVAS // TOPOLOGICAL VISUAL-COT</text>
  
  <!-- Node A -->
  <rect x="80" y="140" width="160" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent A</text>
  <text x="160" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Status: Honest (1)</text>
  
  <!-- Node B -->
  <rect x="340" y="140" width="160" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="420" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent B</text>
  <text x="420" y="186" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Status: Compromised (0)</text>
  
  <!-- Node C -->
  <rect x="580" y="140" width="160" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="660" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent C</text>
  <text x="660" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Parity: A == D</text>
  
  <!-- Node D -->
  <rect x="340" y="340" width="160" height="60" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="420" y="368" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent D</text>
  <text x="420" y="386" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Assertion: A == 1</text>
  
  <!-- Directed Inversion Edges -->
  <path d="M 240 170 L 330 170" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-conflict)"/>
  <text x="285" y="160" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">inverts (¬)</text>
  
  <path d="M 500 170 L 570 170" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-conflict)"/>
  <text x="535" y="160" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">inverts (¬)</text>
  
  <path d="M 640 200 L 480 340" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="275" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">forces A == D</text>
  
  <path d="M 340 370 Q 120 370 140 210" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-success)"/>
  <text x="175" y="320" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">closure feedback</text>
  
  <rect x="60" y="110" width="700" height="310" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="80" y="405" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">2D Topological Closure: Cycle Parity Product = (-1) * (-1) * (+1) = +1</text>
</svg>
